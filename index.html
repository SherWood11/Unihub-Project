<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <title>UniHub</title>
        <link rel="stylesheet" href="style.css">
        <link rel="icon" href="Unihub_icon.png">
    </head>
    <body>
        <header>
            <div class="sr">
                <input id="q" type="search" placeholder="Search deadlines and books…" autocomplete="off">
                <div id="drop" hidden></div>
            </div>

            <h1 id="ttl">UniHub</h1>

            <nav>
                <span class="nl" id="nl">
                    <button class="nb" data-p="home">Home</button>
                    <button class="nb" data-p="deadlines">Deadlines</button>
                    <button class="nb" data-p="academics">Academics</button>
                    <button class="nb" data-p="books">Books</button>
                    <button class="nb" data-p="goals">Goals</button>
                    <button class="nb" data-p="habits">Habits</button>
                    <button class="nb" data-p="budget">Budget</button>
                </span>

                <span class="bell">
                    <button class="nb" id="bb" aria-label="Notifications">🔔</button>
                    <i id="bc"></i>
                    <div id="np" hidden></div>
                </span>

                <button class="nb" id="mm" aria-label="Menu">☰</button>
            </nav>
        </header>

        <main id="m"></main>

        <footer>
            © 2026 UniHub. Created by Sherwood. All rights reserved.
        </footer>

        <div id="toast"></div>

        <dialog id="dg"></dialog>

        <script src="data.js"></script>
        <script src="app.js"></script>
    </body>
</html>
